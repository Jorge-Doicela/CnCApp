server {
    listen 80;
    server_name tu-dominio.com; # Cambiar por tu dominio real

    # Redirección a HTTPS (activar cuando tengas SSL)
    # return 301 https://$host$request_uri;

    # Frontend
    location / {
        proxy_pass http://localhost:8085; # Puerto definido en docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api {
        proxy_pass http://localhost:3005; # Puerto definido en docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Archivos subidos (Uploads)
    location /uploads {
        proxy_pass http://localhost:3005/uploads;
    }
}
